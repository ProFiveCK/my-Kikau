# SwiftLint config — https://github.com/realm/SwiftLint
# myKikau: conservative ruleset. Safety-critical app; prefer explicit over clever.

included:
  - Sources
  - Tests
excluded:
  - .build

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool

# Disable rules that fight Swift Testing / SwiftUI idioms or add noise.
disabled_rules:
  - trailing_whitespace
  - type_name
  - file_length
  - function_body_length
  - cyclomatic_complexity
  # SwiftFormat owns trailing commas; two tools enforcing it fight each other.
  - trailing_comma

line_length:
  warning: 140
  error: 200

type_body_length:
  warning: 400
  error: 800

identifier_name:
  min_length: 1
  max_length: 60
  allowed_symbols: ["_"]

# Tuples that mirror a C struct (the kernel's four CPU tick counters, a
# sockaddr triple) read better as tuples than as one-off structs.
large_tuple:
  warning: 4
  error: 5

# SwiftFormat decides brace placement for wrapped conditions.
opening_brace:
  ignore_multiline_statement_conditions: true
